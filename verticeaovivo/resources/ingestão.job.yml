variables:
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

resources:
  jobs:
    ingestão:
      name: Ingestão
      tasks:
        - task_key: IngestaoAWS
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_BUCKET: datalake_Vertice
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://qjunjiuvowxfgykgsguw.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/02_ingestao_boto3_gabarito.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: IngestaoApi
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/01_ingestao_api.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      description: Rotina de atualização do AWS
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
