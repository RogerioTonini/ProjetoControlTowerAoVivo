# This is a Declarative Automation Bundle definition for verticeaovivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: verticeaovivo
  uuid: 57fc8e73-910c-41c2-b298-8b37c3029b89

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: catálogo do projeto (bronze, silver e gold)
    default: lakehouse_vertice
  warehouse_id:
    description: SQL warehouse das sql_task (Serverless Starter Warehouse)
    default: facd6d5689d35a9a
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    # Sem 'mode: development': ele prefixaria os nomes com '[dev usuario]'.
    # O preset mantém o agendamento pausado no dev.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-068fb8ed-9845.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-068fb8ed-9845.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rt.data.eng.analytics@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rt.data.eng.analytics@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: rt.data.eng.analytics@gmail.com
        level: CAN_MANAGE
